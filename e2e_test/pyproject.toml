[project]
name = "teamup-e2e"
version = "0.1.0"
description = "ARTEMIS end-to-end tests for TeamUp EXE (PRM393 Lab 3)"
requires-python = ">=3.12"
dependencies = [
  "artemis-client @ git+https://github.com/google/artemis.git@351ca8422f7b5b54e80a9c1ce03a222e02415b6b#subdirectory=packages/artemis-client",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["."]
markers = [
  "native: uses a native Android interaction (account picker, permission dialog, notification shade)",
  "error_path: covers an error or empty state",
  "analytics: also checks that an Analytics event was logged",
]
