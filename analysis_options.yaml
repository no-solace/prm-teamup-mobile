include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - lib/firebase_options.dart
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # D14
    - prefer_const_constructors
    - prefer_const_declarations
    - avoid_print
    - unawaited_futures
    - always_declare_return_types
    - prefer_final_locals
    - directives_ordering
